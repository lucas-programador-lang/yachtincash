<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHTINCASH - Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="logo.png" alt="Yachtincash Logo" class="logo-img">
                <h2>Criar Conta 🐳</h2>
                <p style="font-size: 13px; color: #20b2aa;">Ganhe R$ 5,00 grátis no cadastro!</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" id="regName" required placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="regEmail" required placeholder="Digite seu e-mail">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-field">
                        <input type="password" id="regPass" required placeholder="Crie uma senha">
                        <button type="button" class="toggle-password" data-target="regPass" aria-label="Mostrar senha">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn">Cadastrar</button>
            </form>
            <div class="link-text">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (compat) — precisa vir antes de auth.js -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script src="auth.js"></script>
</body>
</html>
